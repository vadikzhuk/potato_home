[project]
name = "screen"
version = "0.1.0"
description = "16:9 info screen for the TV: weather, news, tickets."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6",
    "tzdata",  # timezone data for Europe/Riga, also inside slim Docker images
]

[project.optional-dependencies]
dev = ["pytest>=8"]  # httpx (needed by FastAPI's TestClient) is already a dependency

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["screen", "screen.collectors"]

[tool.setuptools.package-data]
screen = ["templates/*", "static/*"]
