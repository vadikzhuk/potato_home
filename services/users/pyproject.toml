[project]
name = "users"
version = "0.1.0"
description = "Home users and their access to every service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",  # the `users` command sends changes to the service
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
users = "users.cli:run"  # gives you the `users` command

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["users"]

[tool.setuptools.package-data]
users = ["schema.sql"]
