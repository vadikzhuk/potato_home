[project]
name = "estate"
version = "0.1.0"
description = "Cheap houses and apartments in Italy: daily fetch, filter, score, digest."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",          # reads the sites, and asks the users service who is who
    "beautifulsoup4>=4.12",  # reads Trovacasa's HTML
    "pyyaml>=6",            # criteria.yaml
    "tzdata",  # timezone data for Europe/Riga, also inside slim Docker images
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
estate = "estate.cli:run"  # gives you the `estate` command

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["estate", "estate.sources"]

[tool.setuptools.package-data]
estate = ["schema.sql"]
