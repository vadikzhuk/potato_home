[project]
name = "bot"
version = "0.1.0"
description = "Telegram bot for the home tickets service."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=22,<23",  # job-queue: scheduled notifications
    "httpx>=0.27",
    "tzdata",  # timezone data for Europe/Riga, also inside slim Docker images
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot", "bot.tickets", "bot.users"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
